name: Daily Sunshine Email

on:
  # 7 AM UTC = 8 AM BST (UK summer time, covers May–October)
  # When clocks go back in October, update to: '0 8 * * *'
  schedule:
    - cron: '0 7 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send daily sunshine email
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          PARTNER_EMAIL: ${{ secrets.PARTNER_EMAIL }}
          PARTNER_NAME: ${{ secrets.PARTNER_NAME }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: node scripts/send-email.js
